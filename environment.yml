name: nasa-rul-project
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy>=1.24.0
      - pandas>=2.0.0
      - scipy>=1.10.0
      - scikit-learn>=1.3.0
      # TensorFlow: use tensorflow-macos + tensorflow-metal on Apple Silicon
      - tensorflow-macos # Apple Silicon only
      - tensorflow-metal # Apple Silicon GPU acceleration
      # - tensorflow>=2.13.0 # On other platforms: pip install tensorflow>=2.13.0
      - matplotlib>=3.7.0
      - seaborn>=0.12.0
      - pyyaml>=6.0
      - kagglehub
